<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — PoliChan</title>
  <link rel="stylesheet" href="/.static/css/main.css">
  <style>
    #contact-page {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px;
    }
    #contact-page h1 {
      font-size: 1.4rem;
      color: var(--subject);
      margin-bottom: 4px;
    }
    #contact-page .subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 24px;
    }
    #contact-body {
      background: var(--op-bg);
      border: 1px solid var(--border-form);
      padding: 24px;
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--text);
    }
    #contact-body .email {
      font-size: 1.05rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="nav">
  <a class="brand" href="/">Poli<span>Chan</span></a>
  <div class="nav-links">
    <a href="/">Boards</a>
    <a href="/pass">PoliPass</a>
    <a href="/wall">Wall</a>
    <a href="/constitution">Constitution</a>
  </div>
  <div class="nav-right">
    <button id="walletBtn">Connect Wallet</button>
  </div>
</div>

<div id="contact-page">
  <h1>Contact</h1>
  <p class="subtitle">Get in touch with PoliChan.</p>
  <div id="contact-body">
    <p>For takedown requests, bugs, abuse reports, or anything else that needs a direct line, email:</p>
    <p class="email"><a href="mailto:polichansupport@protonmail.com">polichansupport@protonmail.com</a></p>
    <p>For general feedback or discussion about the site, post in <a href="/meta/">/meta/</a> instead.</p>
  </div>
</div>

</body>
</html>
