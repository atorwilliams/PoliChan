<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Press — PoliChan</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/.static/css/main.css">
  <style>
    #press-page {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px;
    }

    #press-page h1 {
      font-size: 1.4rem;
      color: var(--subject);
      margin-bottom: 4px;
    }

    #press-page .subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 24px;
    }

    .press-release {
      background: var(--op-bg);
      border: 1px solid var(--border);
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .press-release-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .press-release-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--subject);
      flex: 1;
    }

    .press-release-date {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .press-release-body {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .press-release-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .press-release-images img {
      max-width: 240px;
      max-height: 240px;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    #press-empty {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #press-loading {
      text-align: center;
      padding: 32px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div id="nav">
  <a class="brand" href="/">Poli<span>Chan</span></a>
  <div class="nav-links">
    <a href="/">Boards</a>
    <a href="/pass">PoliPass</a>
    <a href="/wall">Wall</a>
    <a href="/press" class="active" style="color:#fff;font-weight:bold">Press</a>
  </div>
  <div class="nav-right">
    <button id="walletBtn">Connect Wallet</button>
  </div>
</div>

<div id="press-page">
  <h1>Press</h1>
  <p class="subtitle">
    Official statements and announcements from PoliChan. Site discussion happens
    on the boards — this page is for things we want to put on the record.
  </p>

  <div id="press-loading">Loading…</div>
  <div id="press-releases"></div>
</div>

<script>
  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  fetch('/api/press')
    .then(r => r.json())
    .then(data => {
      document.getElementById('press-loading').style.display = 'none';
      const container = document.getElementById('press-releases');
      const releases = data.releases || [];
      if (!releases.length) {
        container.innerHTML = '<div id="press-empty">No press releases yet.</div>';
        return;
      }
      container.innerHTML = releases.map(p => {
        const imagesHtml = (p.media || []).length
          ? `<div class="press-release-images">${p.media.map(m =>
              `<a href="${esc(m.url)}" target="_blank" rel="noopener"><img src="${esc(m.url)}" loading="lazy"></a>`
            ).join('')}</div>`
          : '';
        return `
          <div class="press-release">
            <div class="press-release-header">
              <div class="press-release-title">${esc(p.title)}</div>
              <div class="press-release-date">${esc(formatDate(p.createdAt))}</div>
            </div>
            <div class="press-release-body">${esc(p.body)}</div>
            ${imagesHtml}
          </div>`;
      }).join('');
    })
    .catch(() => {
      document.getElementById('press-loading').textContent = 'Failed to load.';
    });
</script>
</body>
</html>
