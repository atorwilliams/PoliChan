<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polichan</title>
  <!--OG_META--><meta property="og:site_name" content="PoliChan">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/.static/css/main.css">
</head>
<body>
  <div id="nav"></div>
  <div id="board-index-root"></div>
  <div id="app"></div>
  <div id="scroll-btns">
    <button onclick="window.scrollTo({top:0,behavior:'smooth'})">Top</button>
    <button onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">Bottom</button>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <!-- Turnstile's onload callback can fire before main.js (loaded after, no defer)
       has run, since this script is async. Stub it here so the name always exists. -->
  <script>window._turnstileApiReady = false; window.onTurnstileLoad = function () { window._turnstileApiReady = true; };</script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
  <script src="/.static/js/main.js"></script>
</body>
</html>
